[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gooeypie"
version = "0.15.0"
readme = "README.md"
requires-python = ">=3.10"
description = "A modern Python GUI library designed for beginners."
dependencies = [
    "ctklistbox>=1.5",
    "customtkinter",
    "packaging",
    "pillow>=12.0.0",
]

[project.optional-dependencies]
svg = ["svglib>=1.6.0", "reportlab>=4.4.7"]

[tool.setuptools.packages.find]
include = ["gooeypie*"]
exclude = ["examples*", "tests*"]

[tool.setuptools.package-data]
"*" = ["assets/images/*"]

[project.urls]
Documentation = "https://gooeypie.dev"
Repository = "https://github.com/adamantonio/gooeypie"
